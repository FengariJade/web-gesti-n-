<header class="h-20 flex items-center justify-between px-6 border-b border-[var(--border-color)] bg-[var(--bg-surface)] sticky top-0 z-10 backdrop-blur-xl">

  <div class="flex items-center gap-2">
    <h1 class="text-base font-semibold text-[var(--text-primary)]">{{ pageTitle }}</h1>
    <span class="text-[var(--text-muted)]">/</span>
    <span class="text-sm text-[var(--text-secondary)]">{{ pageSubtitle }}</span>
  </div>

  <div class="flex items-center gap-2">

    <div class="relative">
      <iconify-icon icon="lucide:search" width="14"
        class="absolute left-3 top-1/2 -translate-y-1/2 text-[var(--text-muted)]">
      </iconify-icon>
      <input
        type="text"
        placeholder="Buscar..."
        class="w-48 bg-[var(--bg-card)] border border-[var(--border-color)] rounded-lg pl-8 pr-4 py-1.5 text-sm text-[var(--text-primary)] placeholder:text-[var(--text-muted)] focus:outline-none focus:border-[var(--accent)] transition-all"
      />
    </div>

    <button class="relative p-2 rounded-lg text-[var(--text-secondary)] hover:text-[var(--accent)] hover:bg-[var(--bg-elevated)] transition-all">
      <iconify-icon icon="lucide:bell" width="17"></iconify-icon>
      <span class="status-dot absolute top-1.5 right-1.5 w-2 h-2 bg-[var(--accent)] rounded-full"></span>
    </button>

    <button class="primary-action flex items-center gap-2 text-sm font-medium px-4 py-1.5 rounded-lg transition-all">
      <iconify-icon icon="lucide:plus" width="14"></iconify-icon>
      Nuevo
    </button>

    <!-- Toggle tema -->
    <button (click)="toggle()"
      class="p-2 rounded-lg transition-all hover:bg-[var(--bg-elevated)] text-[var(--text-secondary)] hover:text-[var(--text-primary)]">
      <iconify-icon
        [icon]="themeService.theme() === 'light' ? 'lucide:moon' : 'lucide:sun'"
        width="16">
      </iconify-icon>
    </button>

    <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-semibold cursor-pointer ml-1 shadow-picker"
      style="background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: white">
      AG
    </div>

  </div>
</header>
